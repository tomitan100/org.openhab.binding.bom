# thing configuration
thing-type.config.bom.weather.ftpPath.label = FTP path
thing-type.config.bom.weather.ftpPath.description = FTP path of the directory containing the XML files. Default is ftp://ftp.bom.gov.au/anon/gen/fwo
thing-type.config.bom.weather.observationProductId.label = Observation product ID
thing-type.config.bom.weather.observationProductId.description = The observation product ID e.g IDW60920
thing-type.config.bom.weather.weatherStationId.label = Weather station ID
thing-type.config.bom.weather.weatherStationId.description = The weather station ID (wmo-id attribute in observation XML). e.g 94608
thing-type.config.bom.weather.precisForecastProductId.label = Precis forecast product ID
thing-type.config.bom.weather.precisForecastProductId.description = The precis forecast product ID. e.g IDW14199
thing-type.config.bom.weather.areaId.label = Area ID
thing-type.config.bom.weather.areaId.description = The area ID (aac attribute in forecast XML). e.g WA_PT053
thing-type.config.bom.weather.cityTownForecastProductId.label = City/town/district forecast product ID
thing-type.config.bom.weather.cityTownForecastProductId.description = The city, town or district forecast product ID e.g IDW12300
thing-type.config.bom.weather.observationRefreshInterval.label = Observation refresh interval in minutes
thing-type.config.bom.weather.observationRefreshInterval.description = Refresh interval of observation data. Default to 15 minutes.
thing-type.config.bom.weather.forecastRefreshInterval.label = Forecast refresh interval in minutes
thing-type.config.bom.weather.forecastRefreshInterval.description = Refresh interval of forecast data. Default to 30 minutes.
thing-type.config.bom.weather.retainMinMaxTemperature.label = Retain minimum and maximum temperature
thing-type.config.bom.weather.retainMinMaxTemperature.description = Retain minimum temperature for today, use minimum/maximum temperature of tomorrow if data does not exist.
thing-type.config.bom.image.imageSources.group.label = Image Sources
thing-type.config.bom.image.imageSources.group.description = BOM Image Sources
thing-type.config.bom.image.imageGeneration.group.label = Image Generation
thing-type.config.bom.image.imageGeneration.group.description = Image generation configuration
thing-type.config.bom.image.ftpServer.label = FTP server
thing-type.config.bom.image.ftpServer.description = FTP path of the directory containing the images. Default is ftp://ftp.bom.gov.au.
thing-type.config.bom.image.imagesPath.label = Images directory path
thing-type.config.bom.image.imagesPath.description = The path to the images to monitor e.g /anon/gen/radar/.
thing-type.config.bom.image.productId.label = Image product ID
thing-type.config.bom.image.productId.description = The product ID the images e.g IDR701.
thing-type.config.bom.image.transparenciesPath.label = Transparencies directory path
thing-type.config.bom.image.transparenciesPath.description = The path to the directory where transparent images are stored e.g /anon/gen/radar_transparencies/.
thing-type.config.bom.image.filenameRegex.label = Regular expression for image file filter
thing-type.config.bom.image.filenameRegex.description = Use regular expression to match image files. This is optional.
thing-type.config.bom.image.dateRange.label = Date range to search
thing-type.config.bom.image.dateRange.description = The date range of files to process. Default is last_24h (last 24 hours).
thing-type.config.bom.image.layersConfiguration.label = Image layers configuration
thing-type.config.bom.image.layersConfiguration.description = The image layers configuration. See documentation.
thing-type.config.bom.image.monitoringInterval.label = Monitoring interval in minutes
thing-type.config.bom.image.monitoringInterval.description = The interval to check for new images in minutes. Default is 15 minutes.
thing-type.config.bom.image.generatePngs.label = Generate PNG images
thing-type.config.bom.image.generatePngs.description = Generate PNG images from series. Default is off.
thing-type.config.bom.image.generateGif.label = Generate animated GIF
thing-type.config.bom.image.generateGif.description = Generate animated GIF from a series of images. Default is off.
thing-type.config.bom.image.gifImageDelay.label = GIF image delay in ms
thing-type.config.bom.image.gifImageDelay.description = The delay between each GIF image. Default is 1000 ms (1 second).
thing-type.config.bom.image.gifImageLoop.label = Enable GIF loop
thing-type.config.bom.image.gifImageLoop.description = Enable animated GIF image loop.
thing-type.config.bom.image.embedLocalTimestamp.label = Embed local timestamp
thing-type.config.bom.image.embedLocalTimestamp.description = Embed local timestamp into each image.
thing-type.config.bom.image.localTimestampProperties.label = Local timestamp properties
thing-type.config.bom.image.localTimestampProperties.description = Local time properties configuration.
thing-type.config.bom.image.tiffImageIndex.label = TIFF image index
thing-type.config.bom.image.tiffImageIndex.description = The index of the image to use in a multi-image TIFF file. Index lower than two is not recommended. Applicable to high-definition satellite (e.g Himawari-8) images only.
thing-type.config.bom.image.imagePostProcessing.label = Image post-processing
thing-type.config.bom.image.imagePostProcessing.description = Final image post-processing properties. See documentation.
thing-type.config.bom.image.imageOutputPath.label = Image output path
thing-type.config.bom.image.imageOutputPath.description = The path to the directory where generated image(s) will be saved to.
thing-type.config.bom.image.imageOutputFilename.label = Image output filename
thing-type.config.bom.image.imageOutputFilename.description = The name of the generated image filename. Do not include file extension. e.g ${pid} or radar-512km.
